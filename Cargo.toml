[package]
name = "dsh-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform system tray controller for DeepSeek Harness (dsh)"
license = "MIT"
readme = "README.md"
default-run = "dsh-tray"
keywords = ["dsh", "deepseek", "tray", "system-tray", "rust"]
categories = ["gui", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
semver = "1.0"
ureq = "3.5"
tray-icon = "0.26"
tao = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.4"
fs4 = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
